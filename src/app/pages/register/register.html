<div class="auth-container">
    <div class="auth-card">
        <h1>Create account</h1>
        <p class="subtitle">Create your VPS Monitor account</p>

        <form (ngSubmit)="register()">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    id="username"
                    type="text"
                    [(ngModel)]="username"
                    name="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    id="email"
                    type="email"
                    [(ngModel)]="email"
                    name="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password"
                    type="password"
                    [(ngModel)]="password"
                    name="password"
                    required
                >
            </div>

            <button type="submit">Register</button>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a routerLink="/login">Login</a>
        </p>
    </div>
</div>
