<div class="auth-container">
    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="subtitle">Login to VPS Monitor</p>

        <form (ngSubmit)="login()">

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    id="email"
                    type="email"
                    [(ngModel)]="email"
                    name="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password"
                    type="password"
                    [(ngModel)]="password"
                    name="password"
                    required
                >
            </div>

            <button type="submit">Login</button>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a routerLink="/register">Register</a>
        </p>
    </div>
</div>
